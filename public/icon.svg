  <line x1="170" y1="180" x2="170" y2="340" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
  <rect x="150" y="210" width="40" height="100" rx="6" fill="#10b981"/>
  <!-- Candlestick 2 -->
  <line x1="256" y1="130" x2="256" y2="380" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
  <rect x="236" y="160" width="40" height="130" rx="6" fill="#10b981"/>
  <!-- Candlestick 3 -->
  <line x1="342" y1="100" x2="342" y2="320" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
